version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: atlas_postgres
    restart: always
    environment:
      POSTGRES_DB: atlas_db
      POSTGRES_USER: atlas_user
      POSTGRES_PASSWORD: atlas_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atlas_user -d atlas_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - atlas_net

  qdrant:
    image: qdrant/qdrant:v1.8.4
    container_name: atlas_qdrant
    restart: always
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:6333/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - atlas_net

  redis:
    image: redis:7-alpine
    container_name: atlas_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - atlas_net

volumes:
  postgres_data:
  qdrant_data:
  redis_data:

networks:
  atlas_net:
    driver: bridge

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas-rag"
version = "0.1.0"
description = "Enterprise Hybrid Retrieval-Augmented Generation (RAG) Platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "structlog>=24.1.0",
    "sqlalchemy[asyncio]>=2.0.28",
    "asyncpg>=0.29.0",
    "alembic>=1.13.1",
    "pypdf>=6.15.0",
    "pymupdf>=1.28.2",
    "tiktoken>=0.13.0",
    "fastembed>=0.8.0",
    "numpy>=2.4.6",
    "qdrant-client>=1.19.0",
    "openai>=3.3.1",
    "pyjwt>=2.13.0",
    "passlib[bcrypt]>=1.7.4",
    "celery>=5.6.3",
    "redis>=8.1.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
rerank = [
    "sentence-transformers>=6.0.0",
]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

